name: Aurora Read-Only Verification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aurora-p2-executor.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-readonly-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'gomez5757/aurora-paper-executor' && github.ref == 'refs/heads/main' && github.actor == 'gomez5757'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private source for tests only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gomez5757/aurora-swing-paper
          ref: main
          path: private
          fetch-depth: 1
          ssh-key: ${{ secrets.AURORA_PRIVATE_SSH_KEY }}
          persist-credentials: false
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: private
        run: python -m pip install -r requirements.txt
      - name: Verify all tests without broker access
        working-directory: private
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q bridge p2_bridge tests
          git diff --check HEAD
