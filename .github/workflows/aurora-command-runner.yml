name: Aurora Queue Command Runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: aurora-public-executor
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.repository == 'gomez5757/aurora-paper-executor' &&
      github.event.issue.number == 1 &&
      github.event.comment.user.login == 'gomez5757' &&
      (github.event.comment.body == '/run p1' || github.event.comment.body == '/run p2')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout private Aurora repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gomez5757/aurora-swing-paper
          ref: main
          path: private
          fetch-depth: 0
          ssh-key: ${{ secrets.AURORA_PRIVATE_SSH_KEY }}
          persist-credentials: true
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install private bridge dependencies
        working-directory: private
        run: python -m pip install -r requirements.txt

      - name: Verify private bridge loads
        working-directory: private
        run: |
          python -m compileall -q bridge p2_bridge
          git diff --check HEAD

      - name: Execute one authorized private queue
        working-directory: private
        env:
          AURORA_OAUTH_BOX_PRIVATE_KEY_B64: ${{ secrets.AURORA_OAUTH_BOX_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          export AURORA_DAEMON_STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ "${{ github.event.comment.body }}" == "/run p1" ]]; then
            export ALPACA_OAUTH_PROFILE_FILE="auth/p1.oauth.sealed"
            python -m bridge.queue_run
          else
            export ALPACA_OAUTH_PROFILE_FILE="auth/p2.oauth.sealed"
            python -m p2_bridge.queue_run
          fi
