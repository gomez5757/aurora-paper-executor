name: Aurora Scheduled Queue Daemon

on:
  schedule:
    # Current challenges end before the US DST change. 14:05 UTC = 10:05 ET.
    - cron: '5 14 * * *'
  workflow_dispatch:
    inputs:
      private_ref:
        description: 'Private Aurora ref to execute'
        required: false
        default: 'main'
      duration_seconds:
        description: 'Daemon lifetime for manual verification'
        required: false
        default: '600'

permissions:
  contents: read

concurrency:
  group: aurora-public-executor
  cancel-in-progress: false

jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Gate scheduled challenge window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            now="$(date -u +%s)"
            cutoff="$(date -u -d '2026-10-23T00:30:00Z' +%s)"
            if [ "$now" -gt "$cutoff" ]; then
              echo "AURORA_SHOULD_RUN=false" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "AURORA_DAEMON_DURATION_SECONDS=10200" >> "$GITHUB_ENV"
            echo "AURORA_PRIVATE_REF=main" >> "$GITHUB_ENV"
          else
            echo "AURORA_DAEMON_DURATION_SECONDS=${{ inputs.duration_seconds }}" >> "$GITHUB_ENV"
            echo "AURORA_PRIVATE_REF=${{ inputs.private_ref }}" >> "$GITHUB_ENV"
          fi
          echo "AURORA_SHOULD_RUN=true" >> "$GITHUB_ENV"

      - name: Checkout private Aurora repository
        if: env.AURORA_SHOULD_RUN == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gomez5757/aurora-swing-paper
          ref: ${{ env.AURORA_PRIVATE_REF }}
          path: private
          fetch-depth: 0
          ssh-key: ${{ secrets.AURORA_PRIVATE_SSH_KEY }}
          persist-credentials: true

      - name: Set up Python
        if: env.AURORA_SHOULD_RUN == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install private bridge dependencies
        if: env.AURORA_SHOULD_RUN == 'true'
        working-directory: private
        run: python -m pip install -r requirements.txt

      - name: Verify private bridge
        if: env.AURORA_SHOULD_RUN == 'true'
        working-directory: private
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q bridge p2_bridge tests
          git diff --check HEAD

      - name: Poll authorized private queues
        if: env.AURORA_SHOULD_RUN == 'true'
        working-directory: private
        env:
          AURORA_OAUTH_BOX_PRIVATE_KEY_B64: ${{ secrets.AURORA_OAUTH_BOX_PRIVATE_KEY_B64 }}
          AURORA_DAEMON_DURATION_SECONDS: ${{ env.AURORA_DAEMON_DURATION_SECONDS }}
          AURORA_DAEMON_POLL_SECONDS: '10'
        run: python -m bridge.cloud_queue_daemon
