name: Aurora Scheduled Queue Daemon

on:
  schedule:
    # One daily warm-up; manual starts and reruns are available at any hour.
    - cron: '7 14 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/aurora-queue-daemon.yml']
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Worker lifetime in seconds (60-10200), at any time'
        required: false
        default: '7200'

permissions:
  contents: read

concurrency:
  group: aurora-public-executor
  cancel-in-progress: false

jobs:
  daemon:
    if: >-
      github.repository == 'gomez5757/aurora-paper-executor' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.actor == 'gomez5757')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Configure bounded worker lifetime
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DURATION: ${{ inputs.duration_seconds }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone

          def settings(now, event, requested, attempt):
              if now.tzinfo is None:
                  raise ValueError('UTC-aware clock required')
              if event not in {'schedule', 'push', 'workflow_dispatch'}:
                  raise ValueError('Unsupported executor event')
              attempt = int(attempt)
              if attempt < 1:
                  raise ValueError('Invalid run attempt')
              # Only automatic first attempts stop after the campaign.
              # Explicit starts/reruns remain available for reconciliation.
              cutoff = datetime(2026, 10, 23, 0, 30, tzinfo=timezone.utc)
              if event == 'schedule' and attempt == 1 and now >= cutoff:
                  return {'AURORA_SHOULD_RUN': 'false'}
              duration = int(requested or '7200') if event == 'workflow_dispatch' else 7200
              if not 60 <= duration <= 10200:
                  raise ValueError('Invalid worker lifetime')
              return {
                  'AURORA_SHOULD_RUN': 'true',
                  'AURORA_DAEMON_DURATION_SECONDS': str(duration),
                  'AURORA_DAEMON_END_UTC': (now + timedelta(seconds=duration)).isoformat(),
              }

          values = settings(datetime.now(timezone.utc), os.environ['EVENT_NAME'],
                            os.environ.get('REQUESTED_DURATION', ''), os.environ['GITHUB_RUN_ATTEMPT'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY

      - name: Checkout private Aurora repository
        if: env.AURORA_SHOULD_RUN == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gomez5757/aurora-swing-paper
          ref: main
          path: private
          fetch-depth: 0
          ssh-key: ${{ secrets.AURORA_PRIVATE_SSH_KEY }}
          persist-credentials: true

      - name: Set up Python
        if: env.AURORA_SHOULD_RUN == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install private bridge dependencies
        if: env.AURORA_SHOULD_RUN == 'true'
        working-directory: private
        run: python -m pip install -r requirements.txt

      - name: Verify private bridge
        if: env.AURORA_SHOULD_RUN == 'true'
        working-directory: private
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q bridge p2_bridge tests
          git diff --check HEAD

      - name: Poll authorized private queues
        if: env.AURORA_SHOULD_RUN == 'true'
        working-directory: private
        env:
          AURORA_OAUTH_BOX_PRIVATE_KEY_B64: ${{ secrets.AURORA_OAUTH_BOX_PRIVATE_KEY_B64 }}
          AURORA_DAEMON_DURATION_SECONDS: ${{ env.AURORA_DAEMON_DURATION_SECONDS }}
          AURORA_DAEMON_END_UTC: ${{ env.AURORA_DAEMON_END_UTC }}
          AURORA_DAEMON_POLL_SECONDS: '10'
        run: python -m bridge.cloud_queue_daemon
